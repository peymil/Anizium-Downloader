name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build executable
        run: uv run build-exe

      - name: Sign all binaries (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/anizium/anizium

      - name: Add macOS install script
        if: runner.os == 'macOS'
        run: |
          cat > dist/anizium/install.command << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          xattr -dr com.apple.quarantine "$DIR"
          echo "Done! You can now run ./anizium"
          EOF
          chmod +x dist/anizium/install.command

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/anizium/anizium.exe -DestinationPath anizium-windows.zip

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: zip -j anizium-${{ matrix.platform }}.zip dist/anizium/anizium dist/anizium/install.command 2>/dev/null || zip -j anizium-${{ matrix.platform }}.zip dist/anizium/anizium

      - uses: actions/upload-artifact@v4
        with:
          name: anizium-${{ matrix.platform }}
          path: anizium-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
