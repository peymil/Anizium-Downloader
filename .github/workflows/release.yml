name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build executable
        run: uv run build-exe

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/anizium

      - name: Rename and prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/anizium.exe anizium-windows.exe

      - name: Rename and prepare artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp dist/anizium anizium-macos
          cat > "Anizium.command" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          xattr -dr com.apple.quarantine "$DIR/anizium-macos" 2>/dev/null
          chmod +x "$DIR/anizium-macos"
          "$DIR/anizium-macos"
          EOF
          chmod +x "Anizium.command"

      - name: Rename and prepare artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cp dist/anizium anizium-linux

      - uses: actions/upload-artifact@v4
        with:
          name: anizium-${{ matrix.platform }}
          path: |
            anizium-*
            Anizium.command

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            anizium-windows.exe
            anizium-macos
            anizium-linux
            Anizium.command
          generate_release_notes: true
