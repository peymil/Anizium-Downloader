[project]
name = "anizium-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright",
    "requests",
    "yt-dlp",
    "greenlet",
]

[project.scripts]
build-exe = "build:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["build"]

[dependency-groups]
dev = [
    "pyinstaller",
]
